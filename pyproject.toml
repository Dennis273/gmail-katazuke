[project]
name = "gmail-katazuke"
version = "0.1.0"
description = "Gmail analyzer and organizer - analyze your inbox, then clean it up"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.scripts]
gmail-katazuke = "gmail_katazuke.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
